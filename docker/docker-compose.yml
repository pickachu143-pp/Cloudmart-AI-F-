# ================================
# CloudMart AI — Local Development Stack
# Run with: docker compose -f docker/docker-compose.yml up --build
# ================================
version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: cloudmart-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudmart-net

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cloudmart-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:8080
      DB_PROVIDER: mongodb
      MONGO_URI: mongodb://mongo:27017/cloudmart-ai
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: 7d
      JWT_COOKIE_EXPIRES_DAYS: 7
      CLOUDANT_URL: ${CLOUDANT_URL:-}
      CLOUDANT_APIKEY: ${CLOUDANT_APIKEY:-}
      CLOUDANT_DB_NAME: ${CLOUDANT_DB_NAME:-cloudmart_events}
      WATSON_NLU_APIKEY: ${WATSON_NLU_APIKEY:-}
      WATSON_NLU_URL: ${WATSON_NLU_URL:-}
      WATSON_ENABLED: ${WATSON_ENABLED:-true}
      LOG_LEVEL: info
    networks:
      - cloudmart-net

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: cloudmart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - cloudmart-net

volumes:
  mongo_data:

networks:
  cloudmart-net:
    driver: bridge
