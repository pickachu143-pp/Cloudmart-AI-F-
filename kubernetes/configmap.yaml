# ================================
# CloudMart AI — ConfigMap
# Non-sensitive backend configuration. Sensitive values live in secrets.yaml.
# ================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudmart-config
  namespace: cloudmart
  labels:
    app: cloudmart-ai
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLIENT_URL: "https://cloudmart.example.com"
  DB_PROVIDER: "mongodb"
  MONGO_URI: "mongodb://mongo-service:27017/cloudmart-ai"
  CLOUDANT_DB_NAME: "cloudmart_events"
  JWT_EXPIRES_IN: "7d"
  JWT_COOKIE_EXPIRES_DAYS: "7"
  WATSON_ENABLED: "true"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "300"
